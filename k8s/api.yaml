apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: stock-api:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env:
            - {name: POSTGRES_HOST, value: "postgres"}
            - {name: POSTGRES_PORT, value: "5432"}
            - {name: REDIS_HOST, value: "redis"}
            - {name: REDIS_PORT, value: "6379"}
          envFrom:
            - secretRef: {name: app-secrets}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  type: NodePort
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]