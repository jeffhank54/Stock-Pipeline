apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels: {app: producer}
  template:
    metadata:
      labels: {app: producer}
    spec:
      containers:
        - name: producer
          image: stock-producer:latest
          imagePullPolicy: Never
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: MOCK_MODE, value: "true"}
          envFrom:
            - secretRef: {name: app-secrets}