apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-schema
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS ticks (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(10) NOT NULL,
        price NUMERIC(12,2) NOT NULL,
        tick_timestamp TIMESTAMPTZ NOT NULL,
        inserted_at TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_ticks_symbol_time ON ticks (symbol, tick_timestamp);
    CREATE TABLE IF NOT EXISTS alerts (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(10) NOT NULL,
        alert_type VARCHAR(50) NOT NULL,
        pct_change NUMERIC(8,2),
        triggered_at TIMESTAMP DEFAULT NOW(),
        details TEXT
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{containerPort: 5432}]
          envFrom:
            - secretRef: {name: app-secrets}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "stockuser"]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - {name: pgdata, persistentVolumeClaim: {claimName: pgdata-pvc}}
        - {name: schema, configMap: {name: postgres-schema}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]